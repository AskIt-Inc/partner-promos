name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static Pages artifact
    runs-on: ubuntu-latest
    env:
      PROMO_ENVIRONMENT: production
      STTT_PUBLIC_BASE_URL: ${{ vars.STTT_PUBLIC_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate production runtime configuration
        run: node scripts/generate-runtime-config.js --environment=production

      - name: Verify runtime configuration and tracked-link flow
        run: |
          node scripts/generate-runtime-config.js --check=runtime-config.js
          node scripts/test_source_scoped_links.js
          bash scripts/verify-phase-1d.sh --config-only

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy static Pages artifact
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
